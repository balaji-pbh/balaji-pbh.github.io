<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827">
<title>Blue Shirts</title><meta name="description" content="Best stylish shirt for mens and boys in blue colour"><link rel="canonical" href="https://balaji-pbh.github.io/products/s1.html">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#111827;--gold:#B78A3B;--gold2:#D4AF62;--cream:#FAF8F4;--paper:#fff;--muted:#6B7280;--line:#E8E3DA;--soft:#F4F0E8;--green:#159447;--shadow:0 12px 35px rgba(17,24,39,.065)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-behavior:smooth}body{margin:0;padding-bottom:82px;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,sans-serif}
.top{position:sticky;top:0;z-index:50;background:rgba(250,248,244,.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.head{height:68px;max-width:1120px;margin:auto;padding:0 16px;display:flex;align-items:center;gap:12px}
.back{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);text-decoration:none;font-size:25px}
.brand{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:17px;font-weight:700}
.wrap{max-width:1120px;margin:auto;padding:18px 16px 35px}
.gallery{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.mainImg{width:100%;height:min(65vh,520px);display:block;object-fit:contain;background:#F1EEE8}
.dots{position:absolute;left:50%;bottom:11px;transform:translateX(-50%);display:flex;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:#C9C4BB}
.dot.active{width:17px;border-radius:5px;background:var(--gold)}
.thumbs{display:flex;gap:8px;overflow:auto;padding:10px 0;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.thumb{width:58px;height:58px;flex:none;object-fit:cover;border-radius:9px;border:2px solid transparent;background:#eee}
.thumb.active{border-color:var(--gold)}
.info{padding-top:12px}
.name{margin:0;font-family:"Playfair Display",Georgia,serif;font-size:32px;line-height:1.12;font-weight:600;letter-spacing:-.5px}
.id{margin-top:7px;color:var(--muted);font-size:10px}
.priceLine{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-top:13px}
.price{font-size:23px;font-weight:700}
.old{color:#9CA3AF;font-size:11px;text-decoration:line-through}
.off{color:var(--green);font-size:10px;font-weight:700}
.descTitle{margin:23px 0 8px;font-size:15px;font-weight:600}
.desc{color:#4B5563;font-size:12px;line-height:1.7;white-space:pre-wrap}
.details{margin-top:17px;border-top:1px solid var(--line)}
.detail{display:flex;justify-content:space-between;gap:15px;padding:11px 0;border-bottom:1px solid var(--line);font-size:11px}
.detail span:first-child{color:var(--muted)}
.ratingBox{margin-top:20px;padding:17px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 16px rgba(17,24,39,.035)}
.ratingTitle{font-size:12px;font-weight:600}
.stars{display:flex;gap:4px;margin-top:8px}
.star{padding:0;border:0;background:none;color:#D6D1C8;font-size:27px;cursor:pointer}
.star.on{color:#C48A2A}
.thanks{min-height:15px;margin-top:5px;color:var(--green);font-size:10px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:80;padding:9px;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.barIn{max-width:1120px;margin:auto;display:grid;grid-template-columns:1fr 1.45fr;gap:9px}
.btn{height:48px;border-radius:13px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:12px;font-weight:700}
.btn.primary{border-color:var(--ink);background:var(--ink);color:#fff}
.lightbox{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(2,6,23,.96)}
.lightbox.show{display:flex}
.lightImg{max-width:96vw;max-height:88vh;object-fit:contain}
.close{position:absolute;right:16px;top:10px;border:0;background:none;color:#fff;font-size:34px}
.prev,.next{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border:0;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:27px}
.prev{left:12px}.next{right:12px}
@media(min-width:800px){body{padding-bottom:35px}.wrap{padding-top:30px;display:grid;grid-template-columns:1.08fr .92fr;gap:30px;align-items:start}.gallery{position:sticky;top:82px}.info{padding-top:5px}.name{font-size:36px}.price{font-size:25px}.bar{position:static;padding:0;margin-top:27px;background:none;border:0;backdrop-filter:none}.barIn{max-width:none}}
</style></head>
