<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><meta name="description" content="Here you can find stylish Men&#039;s Shirts,  casual shirts for party and occasion"><title>Stylish Men&#039;s Shirts</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#111827;--gold:#B78A3B;--gold2:#D4AF62;--cream:#FAF8F4;--paper:#fff;--muted:#6B7280;--line:#E8E3DA;--soft:#F4F0E8;--green:#159447;--shadow:0 10px 30px rgba(17,24,39,.055)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,sans-serif}
.top{position:sticky;top:0;z-index:50;background:rgba(250,248,244,.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.head{max-width:1120px;height:68px;margin:auto;padding:0 16px;display:flex;align-items:center;gap:12px}
.back{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);text-decoration:none;font-size:25px}
.brand{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:17px;font-weight:700}
.wrap{max-width:1120px;margin:auto;padding:28px 16px 50px}
.crumb{color:var(--muted);font-size:11px;margin-bottom:10px}
.titleRow{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:20px}
.titleBox{min-width:0}
.kicker{display:block;color:var(--gold);font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:5px}
.title{margin:0;font-family:"Playfair Display",Georgia,serif;font-size:32px;line-height:1.1;font-weight:600}
.sub{margin:8px 0 0;max-width:620px;color:var(--muted);font-size:12px;line-height:1.55}
.count{flex:none;padding:8px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--muted);font-size:10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.card{position:relative;overflow:hidden;display:block;background:#fff;border:1px solid var(--line);border-radius:17px;color:inherit;text-decoration:none;box-shadow:var(--shadow);transition:transform .2s ease}
.card:active{transform:scale(.985)}
.pic{width:100%;height:190px;display:block;object-fit:cover;background:#EEE9DF}
.body{padding:12px}
.name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{margin-top:7px;font-size:15px;font-weight:700}
.old{text-decoration:line-through;color:#9CA3AF;font-size:10px;font-weight:500;margin-left:5px}
.off{color:#159447;font-size:9px;font-weight:700;margin-left:5px}
.rating{margin-top:6px;color:#B7791F;font-size:10px}
.share{position:absolute;top:9px;right:9px;width:32px;height:32px;border:1px solid rgba(255,255,255,.8);border-radius:50%;background:rgba(255,255,255,.94);box-shadow:0 5px 14px rgba(0,0,0,.12);font-size:14px;cursor:pointer}
.empty{grid-column:1/-1;padding:55px 16px;text-align:center;color:var(--muted);font-size:12px;background:#fff;border:1px solid var(--line);border-radius:16px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr);gap:15px}.pic{height:220px}}
@media(min-width:850px){.head{height:72px}.grid{grid-template-columns:repeat(4,1fr);gap:17px}.pic{height:245px}.title{font-size:38px}}
</style></head>
<body>
<header class="top"><div class="head"><a class="back" href="../index.html">‹</a><div class="brand">BALAJI GARMENTS</div></div></header>
<main class="wrap"><div class="crumb">Home / Category</div><div class="titleRow"><div class="titleBox"><span class="kicker">Collection</span><h1 class="title">Men&#039;s Stylish Shirts</h1><p class="sub">Here you can find stylish Men&#039;s Shirts,  casual shirts for party and occasion</p></div><div class="count">0 items</div></div>
<div class="grid"><div class="empty">No products in this category yet.</div></div>
<script>document.querySelectorAll('.share').forEach(b=>b.onclick=function(e){e.preventDefault();e.stopPropagation();const pid=this.dataset.share;const url='https://balaji-pbh.github.io/products/'+pid;const text='Product ID: '+pid;if(navigator.share)navigator.share({title:'Product',text,url});else navigator.clipboard?.writeText(url+'
'+text).then(()=>alert('Copied!'))});</script>
</body></html>
