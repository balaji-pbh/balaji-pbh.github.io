<title id="pageTitle">Products | YOUR SHOP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--navy:#0F172A;--blue:#2563EB;--teal:#14B8A6;--bg:#F8FAFC;--line:#E2E8F0;--muted:#64748B}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font-family:Inter,system-ui,sans-serif}.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line)}.head{max-width:1050px;height:58px;margin:auto;padding:0 14px;display:flex;align-items:center;gap:9px}.back{font-size:18px;text-decoration:none;color:var(--navy)}.brand{font-size:15px;font-weight:800}.wrap{max-width:1050px;margin:auto;padding:16px 14px 35px}.crumb{font-size:10px;color:var(--muted);margin-bottom:6px}.title{font-size:21px;margin:0}.sub{font-size:11px;color:var(--muted);margin:4px 0 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:0 8px 22px rgba(15,23,42,.05)}.pic{width:100%;height:150px;object-fit:cover;display:block;background:#EEF2FF}.body{padding:9px}.name{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.price{font-size:13px;font-weight:800;margin-top:5px}.old{text-decoration:line-through;color:#94A3B8;font-weight:500;font-size:10px;margin-left:4px}.off{color:#059669;font-size:9px;margin-left:4px}.rating{font-size:10px;color:#F59E0B;margin-top:4px}.share{position:absolute;right:7px;top:7px;width:28px;height:28px;border:0;border-radius:50%;background:rgba(255,255,255,.94);box-shadow:0 4px 12px rgba(0,0,0,.12);font-size:14px}.empty{padding:30px 10px;text-align:center;color:var(--muted);font-size:12px}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.pic{height:210px}}
</style></head><body>
