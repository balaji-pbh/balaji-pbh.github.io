<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2563EB"><meta id="metaDesc" name="description" content="">
<meta id="canonical" rel="canonical" href="">
<meta id="ogTitle" property="og:title" content=""><meta id="ogDesc" property="og:description" content=""><meta id="ogImage" property="og:image" content=""><meta id="ogUrl" property="og:url" content="">
<title id="pageTitle">Product | YOUR SHOP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--navy:#0F172A;--blue:#2563EB;--blue2:#1D4ED8;--teal:#14B8A6;--bg:#F8FAFC;--line:#E2E8F0;--muted:#64748B}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font-family:Inter,system-ui,sans-serif;padding-bottom:70px}.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.head{height:58px;max-width:1050px;margin:auto;padding:0 14px;display:flex;align-items:center;gap:9px}.back{text-decoration:none;color:var(--navy);font-size:20px}.brand{font-size:15px;font-weight:800}.wrap{max-width:1050px;margin:auto;padding:12px 14px 25px}.gallery{position:relative;background:#fff;border-radius:18px;overflow:hidden;border:1px solid var(--line)}.mainImg{width:100%;height:min(68vh,520px);display:block;object-fit:contain;background:#F1F5F9}.dots{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);display:flex;gap:5px}.dot{width:6px;height:6px;border-radius:50%;background:#CBD5E1}.dot.active{background:var(--blue);width:16px;border-radius:4px}.info{padding-top:15px}.name{font-size:20px;line-height:1.2;margin:0}.id{font-size:9px;color:var(--muted);margin-top:5px}.priceLine{display:flex;align-items:center;gap:7px;margin-top:10px}.price{font-size:19px;font-weight:800}.old{text-decoration:line-through;color:#94A3B8;font-size:11px}.off{color:#059669;font-size:10px;font-weight:700}.descTitle{font-size:13px;margin:18px 0 6px}.desc{font-size:12px;line-height:1.65;color:#475569;white-space:pre-wrap}.details{margin-top:12px;border-top:1px solid var(--line)}.detail{display:flex;justify-content:space-between;gap:15px;padding:9px 0;border-bottom:1px solid var(--line);font-size:11px}.detail span:first-child{color:var(--muted)}.ratingBox{margin-top:17px;padding:13px;background:#fff;border:1px solid var(--line);border-radius:14px}.ratingTitle{font-size:12px}.stars{display:flex;gap:3px;margin-top:7px}.star{border:0;background:none;font-size:25px;color:#CBD5E1;padding:0}.star.on{color:#F59E0B}.thanks{font-size:10px;color:#059669;margin-top:4px;min-height:14px}.bar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px}.barIn{max-width:1050px;margin:auto;display:grid;grid-template-columns:1fr 1.4fr;gap:8px}.btn{height:44px;border-radius:12px;border:1px solid var(--line);font-weight:700;font-size:12px;background:#fff;color:var(--navy)}.btn.primary{border-color:var(--blue);background:var(--blue);color:#fff}.btn.primary:active{background:var(--blue2)}.thumbs{display:flex;gap:7px;padding:8px 0;overflow:auto}.thumb{width:55px;height:55px;object-fit:cover;border-radius:9px;border:2px solid transparent}.thumb.active{border-color:var(--blue)}.lightbox{position:fixed;inset:0;z-index:100;background:rgba(2,6,23,.96);display:none;align-items:center;justify-content:center}.lightbox.show{display:flex}.lightImg{max-width:96vw;max-height:88vh;object-fit:contain}.close{position:absolute;right:16px;top:12px;color:#fff;font-size:30px;background:none;border:0}.prev,.next{position:absolute;top:50%;transform:translateY(-50%);color:#fff;background:rgba(255,255,255,.12);border:0;border-radius:50%;width:42px;height:42px;font-size:24px}.prev{left:10px}.next{right:10px}@media(min-width:800px){.wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:25px;align-items:start}.info{padding-top:5px}.gallery{position:sticky;top:72px}}
</style></head><body>
<header class="top"><div class="head"><a class="back" href="javascript:history.back()">‹</a><div id="shopName" class="brand">YOUR SHOP</div></div></header>
<main class="wrap"><section><div class="gallery"><img id="mainImg" class="mainImg" alt="Product image"><div id="dots" class="dots"></div></div><div id="thumbs" class="thumbs"></div></section>
<section class="info"><h1 id="name" class="name">Product</h1><div id="pid" class="id"></div><div class="priceLine"><span id="price" class="price"></span><span id="old" class="old"></span><span id="off" class="off"></span></div><h2 class="descTitle">Description</h2><div id="description" class="desc"></div><div id="details" class="details"></div><div class="ratingBox"><div class="ratingTitle">Rate this product</div><div id="stars" class="stars"></div><div id="thanks" class="thanks"></div></div></section></main>
<div class="bar"><div class="barIn"><button id="shareBtn" class="btn">↗ Share</button><button id="waBtn" class="btn primary">💬 Message Owner</button></div></div>
<div id="lightbox" class="lightbox"><button class="close" id="closeLb">×</button><button class="prev" id="prevLb">‹</button><img id="lightImg" class="lightImg"><button class="next" id="nextLb">›</button></div>
<script src="data.js"></script><script src="script.js"></script></body></html>
